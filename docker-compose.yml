  celery:
    build: .
    command: sh -c "pip install django-cors-headers daphne channels channels-redis && celery -A config worker --loglevel=info"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - cpp-worker-1
      - cpp-worker-2
    environment:
      - DB_ENGINE=postgresql
      - DB_NAME=comwpc
      - DB_USER=comwpc
      - DB_PASSWORD=comwpc
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - EVENT_SERVICE_URL=redis://redis:6379/1

  postgres:
    image: "postgres:16-alpine"
    environment:
      - POSTGRES_DB=comwpc
      - POSTGRES_USER=comwpc
      - POSTGRES_PASSWORD=comwpc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: "redis:7.0-alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  cpp-worker-1:
    build: ./cpp_worker
    environment:
      - PORT=9000
      - WORKER_ID=cpp-worker-1
    ports:
      - "9001:9000"

  cpp-worker-2:
    build: ./cpp_worker
    environment:
      - PORT=9000
      - WORKER_ID=cpp-worker-2
    ports:
      - "9002:9000"

volumes:
  static_value:
  media_value:
  redis-data:
  postgres-data:
